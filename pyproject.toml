[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gtvpvar"
dynamic = ["version"]
description = "GTVP-VAR: VAR models with state-dependent coefficients estimated by random forests (a multivariate extension of the Macroeconomic Random Forest)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ezequiel Grillo" }]
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "numba", "joblib"]
keywords = ["VAR", "random forest", "macroeconomic random forest", "time-varying parameters", "forecasting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Natural Language :: English",
    "Natural Language :: Spanish",
]

[project.urls]
Homepage = "https://github.com/EzequielGrillo/gtvp-var"
Repository = "https://github.com/EzequielGrillo/gtvp-var"
Issues = "https://github.com/EzequielGrillo/gtvp-var/issues"

[project.optional-dependencies]
ejemplos = ["pandas", "scikit-learn", "matplotlib", "openpyxl"]
test = ["pytest"]

[tool.setuptools]
packages = ["gtvpvar"]

[tool.setuptools.dynamic]
version = { attr = "gtvpvar.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
