name: Pruebas

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Pruebas
        run: pytest -q
      - name: Ejemplo minimo
        run: python ejemplos/ejemplo_minimo.py
